name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build sdist/wheel + attach to release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.whl > checksums.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

      - name: Attach distributions to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist/checksums.txt
          generate_release_notes: true

  publish-pypi:
    name: Publish to PyPI
    needs: build-and-release
    runs-on: ubuntu-latest
    # Gated: trusted publishing is not set up on a fresh repo, so an ungated
    # pypa/gh-action-pypi-publish job fails `invalid-publisher` on the FIRST
    # release and leaves a red "pypi" deployment. Enable by setting the repo
    # variable PYPI_PUBLISH=true once a trusted publisher (or token) is configured.
    if: ${{ vars.PYPI_PUBLISH == 'true' }}
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
