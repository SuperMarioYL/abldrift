name: pages
on:
  push:
    branches: ["main"]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  site:
    uses: SuperMarioYL/web-factory/.github/workflows/build-site.yml@03e7ec8a416f868b847d13b3023bf7d1215db767
    with:
      factory_ref: 03e7ec8a416f868b847d13b3023bf7d1215db767
