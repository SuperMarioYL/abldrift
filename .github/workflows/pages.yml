name: pages
on:
  push:
    branches: ["main"]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  site:
    uses: SuperMarioYL/web-factory/.github/workflows/build-site.yml@fbff4bd18225c8795d4d473ac1b92b785fbba1fc
    with:
      factory_ref: fbff4bd18225c8795d4d473ac1b92b785fbba1fc
