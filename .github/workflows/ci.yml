name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # The suite is pure delta/bootstrap computation — no network, no Ollama.
        run: pytest -q
        timeout-minutes: 5

      - name: Lint (ruff)
        run: ruff check abldrift tests
        continue-on-error: true

      - name: Smoke-import the package
        run: |
          python -c "import abldrift, abldrift.cli, abldrift.delta, abldrift.judge, abldrift.probes, abldrift.report; print('import ok', abldrift.__version__)"
          python -m abldrift.cli selftest
