[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abldrift"
version = "0.4.0"
description = "Audit uncensoring/abliteration behavioral drift in local-LLM models — surfaces optimism/tone/risk-aversion shifts beyond refusals, before you ship the modified model."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "llm",
    "ollama",
    "abliteration",
    "uncensored",
    "behavioral-drift",
    "eval",
    "llm-as-judge",
    "ci-gate",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "ollama>=0.4.0",
    "click>=8.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/SuperMarioYL/abldrift"
Repository = "https://github.com/SuperMarioYL/abldrift"
Issues = "https://github.com/SuperMarioYL/abldrift/issues"

[project.scripts]
abldrift = "abldrift.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["abldrift"]

[tool.hatch.build.targets.wheel.force-include]
"abldrift/data/probes.yaml" = "abldrift/data/probes.yaml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Keep the suite runnable straight from a clone with no editable install:
# delta computation is pure and needs no sys.path surgery, but this keeps
# the package importable for any future in-repo tests.
pythonpath = ["."]
